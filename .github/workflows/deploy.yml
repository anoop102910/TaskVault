name: Deploy Node.js Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            REPO_DIR="/home/ubuntu/projects/task-vault"
            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git pull origin main

            cd backend
            echo "${{ secrets.ENV_FILE }}" | base64 -d > .env

            npm install
            npm run build

            # Restart process using pm2
            pm2 delete task-vault || true
            pm2 start npm --name "task-vault" -- start
            pm2 save
